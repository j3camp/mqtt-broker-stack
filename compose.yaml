---
services:
  mosquitto:
    image: ${MOSQUITTO_IMAGE}
    restart: unless-stopped
    entrypoint:
      - /mosquitto/scripts/mosquitto-entrypoint.sh
    ports:
      - "${MQTT_TLS_BIND_ADDRESS:-0.0.0.0}:${MQTT_TLS_PORT:-8883}:8883"
      - "127.0.0.1:${MQTT_WSS_PORT:-9001}:9001"
    expose:
      - "1883"
    networks:
      mqtt-internal:
      mqtt-control:
        ipv4_address: 172.31.0.2
        aliases:
          - mosquitto-control
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/config/certs:/mosquitto/config/certs:ro
      - mosquitto-data:/mosquitto/data
      - ./mosquitto/scripts:/mosquitto/scripts:ro
    secrets:
      - dynsec_admin_password
    healthcheck:
      test:
        - CMD
        - /mosquitto/scripts/healthcheck.sh
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

  dynsec-admin:
    image: ${MOSQUITTO_IMAGE}
    profiles:
      - "admin"
    depends_on:
      mosquitto:
        condition: service_healthy
    entrypoint:
      - /mosquitto/scripts/dynsec-entrypoint.sh
    environment:
      DYNSEC_ADMIN_USERNAME: ${DYNSEC_ADMIN_USERNAME:-admin}
      MQTT_CONTROL_HOSTNAME: ${MQTT_CONTROL_HOSTNAME:-mosquitto-control}
    networks:
      - mqtt-control
    volumes:
      - ./mosquitto/config/certs:/mosquitto/config/certs:ro
      - ./mosquitto/scripts:/mosquitto/scripts:ro
    secrets:
      - dynsec_admin_password
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dynsec-bootstrap:
    image: ${MOSQUITTO_IMAGE}
    depends_on:
      mosquitto:
        condition: service_healthy
    entrypoint:
      - /mosquitto/scripts/harden-dynsec.sh
    environment:
      DYNSEC_ADMIN_USERNAME: ${DYNSEC_ADMIN_USERNAME:-admin}
      MQTT_CONTROL_HOSTNAME: ${MQTT_CONTROL_HOSTNAME:-mosquitto-control}
    networks:
      - mqtt-control
    volumes:
      - ./mosquitto/config/certs:/mosquitto/config/certs:ro
      - ./mosquitto/scripts:/mosquitto/scripts:ro
    secrets:
      - dynsec_admin_password
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dynsec-migration:
    image: ${MOSQUITTO_IMAGE}
    profiles:
      - "migration"
    network_mode: none
    entrypoint:
      - /mosquitto/scripts/install-dynsec-state.sh
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./tmp/dynsec:/migration:ro
      - ./mosquitto/scripts:/mosquitto/scripts:ro
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  mqtt-internal:
    driver: bridge
    internal: true
  mqtt-control:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/28

volumes:
  mosquitto-data:

secrets:
  dynsec_admin_password:
    file: ./mosquitto/config/security/dynsec-admin-password
