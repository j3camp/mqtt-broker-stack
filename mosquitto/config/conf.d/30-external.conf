# External MQTT listener — TLS required, username/password required.
listener 8883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/security/passwords

cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

tls_version tlsv1.2

# Uncomment to require client certificates (mutual TLS):
# require_certificate true
# use_identity_as_username true
