---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and migration unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          pip install yamllint

      - name: ShellCheck scripts
        run: |
          shellcheck --severity=warning \
            scripts/*.sh \
            mosquitto/scripts/*.sh \
            tests/*.sh \
            .github/scripts/ci-create-user.sh

      - name: YAML lint
        run: |
          yamllint \
            -d '{extends: default, rules: {
              line-length: {max: 120},
              truthy: {allowed-values: ["true", "false"]}
            }}' \
            compose.yaml compose.console.yaml \
            docs/admin-console/poc/eclipse-mosquitto-dashboard/compose.yaml \
            docs/admin-console/poc/mqttctl/compose.yaml \
            .github/workflows/ci.yml

      - name: Validate administration architecture decision
        run: bash tests/test-admin-console-architecture.sh

      - name: Run Task 7 migration contract tests
        run: python3 tests/task7_migration_test.py

  compose-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compose inputs
        run: |
          cp .env.example .env
          mkdir -p mosquitto/config/security
          printf '%s\n' compose-validation-secret \
            > mosquitto/config/security/dynsec-admin-password

      - name: Validate Docker Compose config
        run: docker compose config

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      MQTT_INITIAL_USERNAME: ci-admin
      MQTT_INITIAL_PASSWORD: ci-test-password
      MQTT_TEST_USERNAME: ci-admin
      MQTT_TEST_PASSWORD: ci-test-password
      MQTT_SERVER_HOSTNAME: localhost
      DYNSEC_ADMIN_PASSWORD: ci-dynsec-admin-password

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL, MQTT, and WSS test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssl mosquitto-clients
          python3 -m pip install paho-mqtt

      - name: Copy environment
        run: cp .env.example .env

      - name: Generate development certificates
        run: |
          ./scripts/generate-cert.sh \
            --hostname localhost \
            --dns mosquitto-control \
            --ip 127.0.0.1

      - name: Verify certificate generation
        run: |
          test -f mosquitto/config/certs/ca.crt
          test -f mosquitto/config/certs/server.crt
          test -f mosquitto/config/certs/server.key
          openssl verify \
            -CAfile mosquitto/config/certs/ca.crt \
            mosquitto/config/certs/server.crt

      - name: Prepare administrator and legacy migration fixtures
        run: |
          ./scripts/bootstrap-dynsec.sh --force
          bash .github/scripts/ci-create-user.sh
          cat > mosquitto/config/security/acl <<'EOF'
          user ci-admin
          topic readwrite test/#
          topic deny test/private/#
          pattern write devices/%u/telemetry/#
          EOF
          cat > mosquitto/config/security/migration-owners.csv <<'EOF'
          username,owner,group
          ci-admin,CI Platform Team,ci-applications
          EOF

      - name: Validate static configuration
        run: ./scripts/validate.sh --quick

      - name: Start broker
        run: docker compose up -d

      - name: Wait for broker to become healthy
        timeout-minutes: 3
        run: |
          for i in $(seq 1 36); do
            STATUS="$(docker inspect \
              --format '{{.State.Health.Status}}' \
              "$(docker compose ps -q mosquitto)" 2>/dev/null || echo unknown)"
            echo "Healthcheck status: ${STATUS}"
            if [ "${STATUS}" = "healthy" ]; then
              break
            fi
            if [ "${i}" -eq 36 ]; then
              docker compose logs mosquitto
              exit 1
            fi
            sleep 5
          done

      - name: Migrate legacy identities and ACLs
        run: |
          ./scripts/wait-dynsec-bootstrap.sh
          ./scripts/migrate-dynsec.sh \
            --password-file mosquitto/config/security/passwords \
            --acl-file mosquitto/config/security/acl \
            --owners-file mosquitto/config/security/migration-owners.csv

      - name: Test internal listener
        run: bash tests/test-internal.sh

      - name: Test external anonymous denied
        run: bash tests/test-external-anonymous-denied.sh

      - name: Test TLS verification
        run: bash tests/test-tls-verification.sh

      - name: Test external authentication
        run: bash tests/test-external-auth.sh

      - name: Test Dynamic Security ACL matrix
        run: bash tests/test-acl.sh

      - name: Test WSS authentication
        run: python3 tests/test-wss-auth.py

      - name: Test control-plane isolation
        run: bash tests/test-control-isolation.sh

      - name: Test migration rollback
        run: bash tests/test-migration-rollback.sh

      - name: Test healthcheck
        run: bash tests/test-healthcheck.sh

      - name: Show broker logs on failure
        if: failure()
        run: docker compose logs mosquitto

      - name: Docker cleanup
        if: always()
        run: docker compose down -v --remove-orphans
